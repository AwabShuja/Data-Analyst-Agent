# Database Configuration
database:
  raw_csv_path: "data/raw/Order_by_Outlet_type.csv"
  processed_db_path: "data/processed/orders.db"
  
  # Table names
  tables:
    orders: "orders"
    customers: "customers"
    products: "products"
    brands: "brands"
    categories: "categories"

# Data Enrichment Settings
enrichment:
  # Price ranges by category (in local currency)
  price_ranges:
    "Food & Restaurants": [200, 3000]
    "Market Place": [500, 15000]
    "Stores & Grocery": [300, 8000]
    "Health & Fitness": [400, 5000]
    "Health, Beauty & Gifts": [300, 4000]
    "Fashion": [800, 12000]
    "default": [300, 5000]
  
  # Quantity ranges
  quantity_range: [1, 5]
  
  # Product name templates
  product_templates:
    "Food & Restaurants": ["Meal Deal", "Combo", "Special", "Platter", "Family Pack"]
    "Fashion": ["Shirt", "Dress", "Jeans", "Shoes", "Bag"]
    "Market Place": ["Electronics", "Home Item", "Gadget", "Appliance"]
    "Stores & Grocery": ["Grocery Pack", "Staples Bundle", "Fresh Items"]

# Schema Documentation
schema:
  description: "E-commerce orders database with normalized tables"
  version: "1.0"

# SQL Safety Configuration (Phase 2A)
safety:
  # Maximum rows allowed in query results
  max_rows: 10000
  
  # Query execution timeout in seconds
  query_timeout_seconds: 30
  
  # Dangerous SQL keywords to block
  dangerous_keywords:
    - DELETE
    - DROP
    - UPDATE
    - INSERT
    - ALTER
    - CREATE
    - TRUNCATE
    - REPLACE
    - GRANT
    - REVOKE
    - EXEC
    - EXECUTE
  
  # Tables that require WHERE clause (large tables)
  require_where_tables:
    - orders
  
  # Enable query auditing
  audit_enabled: true
  
  # Audit database path
  audit_db_path: "data/processed/query_audit.db"

# MCP Server Configuration (Phase 2B)
mcp:
  # Server information
  server_name: "AI Data Analyst Database Server"
  server_version: "1.0.0"
  
  # Resources configuration
  resources:
    expose_schema: true
    expose_statistics: true
    expose_examples: true
    expose_safety_rules: true
  
  # Tools configuration
  tools:
    execute_queries: true
    validate_queries: true
    preview_tables: true
    suggest_queries: true

# LLM Agent Configuration (Phase 2C)
agent:
  # Groq API settings
  llm_provider: "groq"
  model: "llama-3.3-70b-versatile"  # Options: llama-3.3-70b-versatile, mixtral-8x7b-32768
  
  # Generation parameters
  temperature: 0.1  # Lower = more deterministic SQL generation
  max_tokens: 2048
  
  # Self-correction settings
  max_retries: 2  # Number of correction attempts for failed queries
  enable_self_correction: true
  
  # Interpretation settings
  interpretation_temperature: 0.3  # Slightly higher for natural language
  interpretation_max_tokens: 512
  
  # Context settings
  include_schema_context: true  # Include schema info in prompts
  max_conversation_history: 50  # Max queries to keep in memory

# Logging
logging:
  level: "INFO"
  file: "logs/data_setup.log"
